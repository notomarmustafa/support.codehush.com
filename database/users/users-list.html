<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mock REST API Service</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: auto; padding: 20px; }
    .container { margin-bottom: 20px; }
    .entry { padding: 10px; border: 1px solid #ddd; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Frontend Mock REST API Service</h1>

  <div class="container">
    <h2>Create New Mock Entry</h2>
    <form id="mockForm">
      <label>Data:</label>
      <input type="text" id="data" placeholder="Enter mock data" required>
      <button type="submit">Add Entry</button>
    </form>
  </div>

  <div class="container">
    <h2>All Entries</h2>
    <div id="entries"></div>
  </div>

  <script>
    const STORAGE_KEY = 'mockApiData';

    // Function to load entries from Local Storage
    function loadEntries() {
      const entriesDiv = document.getElementById('entries');
      entriesDiv.innerHTML = '';
      const entries = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

      entries.forEach(entry => {
        const entryDiv = document.createElement('div');
        entryDiv.className = 'entry';
        entryDiv.innerHTML = `
          <p><strong>ID:</strong> ${entry.id}</p>
          <p><strong>Data:</strong> ${entry.data}</p>
          <button onclick="deleteEntry(${entry.id})">Delete</button>
        `;
        entriesDiv.appendChild(entryDiv);
      });
    }

    // Function to add a new entry
    document.getElementById('mockForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const data = document.getElementById('data').value;
      const entries = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      const newEntry = { id: Date.now(), data };
      entries.push(newEntry);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      document.getElementById('data').value = '';
      loadEntries();
    });

    // Function to delete an entry
    function deleteEntry(id) {
      let entries = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      entries = entries.filter(entry => entry.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      loadEntries();
    }

    // Load entries when the page loads
    loadEntries();
  </script>
</body>
</html>
